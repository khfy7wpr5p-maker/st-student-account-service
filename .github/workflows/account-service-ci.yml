name: Account Service CI

on:
  push:
    branches:
      - feature/student-account-service-v1
  pull_request:

jobs:
  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --test tests/contract/serviceComposition.test.js tests/contract/securityRegression.test.js
      - run: npx firebase emulators:exec --project demo-st-student-account --only auth,firestore "node --test tests/emulator/firestoreRepositories.test.js tests/emulator/firestoreRules.test.js tests/emulator/firestoreUsage.test.js tests/emulator/firestoreReadModelRepositories.test.js"
      - run: npx firebase emulators:exec --project demo-st-student-account --only auth,database "node --test tests/emulator/realtimePresenceRules.test.js"

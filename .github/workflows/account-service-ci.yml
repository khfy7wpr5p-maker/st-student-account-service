name: Account Service CI

on:
  push:
    branches:
      - feature/student-account-service-v1
  pull_request:

jobs:
  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx firebase emulators:exec --project demo-st-student-account --only auth,firestore "node --test tests/emulator/firestoreRepositories.test.js tests/emulator/firestoreRules.test.js"
